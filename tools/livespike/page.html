<!doctype html>
<html><head><meta charset="utf-8"><title>Spanwall live spike</title>
<style>html,body{margin:0;height:100%;background:#05070a;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script>
// Worst case ASCII scene: the whole grid is redrawn every frame.
// A bright sweep bar moves across the virtual screen in physical pixels,
// so it should travel smoothly from one monitor to the next if they are in sync.
const q = new URLSearchParams(location.search);
const M = +q.get('m'), MX = +q.get('x'), MY = +q.get('y'), VX = +q.get('vx'), VW = +q.get('vw');
const FPS = +(q.get('fps') || 30);
const c = document.getElementById('c'), g = c.getContext('2d', {alpha: false});
const RAMP = ' .:-=+*#%@';
let W, H, dpr, cw, ch, cols, rows;
function size() {
  dpr = devicePixelRatio || 1;
  W = c.width = Math.round(innerWidth * dpr); H = c.height = Math.round(innerHeight * dpr);
  ch = Math.round(16 * dpr); cw = Math.round(ch * 0.6);
  cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
  g.font = ch + 'px Consolas, monospace'; g.textBaseline = 'top';
}
addEventListener('resize', size); size();
let frames = 0, work = 0, last = 0;
const step = 1000 / FPS;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < step - 2) return;
  last = now;
  const t0 = performance.now();
  const t = Date.now() / 1000; // shared wall clock so every monitor agrees
  g.fillStyle = '#05070a'; g.fillRect(0, 0, W, H);
  // physical position of this monitor's left edge inside the virtual screen
  const ox = MX - VX;
  const sweep = ((t / 4) % 1) * VW - ox; // bar x in this window's pixels
  for (let r = 0; r < rows; r++) {
    const y = r * ch;
    let line = '';
    for (let k = 0; k < cols; k++) {
      const gx = (ox + k * cw) / cw; // global column
      const v = Math.sin(gx * 0.11 + t * 1.3) * Math.cos(r * 0.17 - t * 0.9) * 0.5 + 0.5;
      line += RAMP[Math.min(RAMP.length - 1, (v * RAMP.length) | 0)];
    }
    g.fillStyle = '#2f8f5b'; g.fillText(line, 0, y);
  }
  g.fillStyle = 'rgba(120,255,180,0.85)';
  g.fillRect(Math.round(sweep), 0, Math.round(6 * dpr), H);
  g.fillStyle = '#e8fff2'; g.font = Math.round(28 * dpr) + 'px Consolas, monospace';
  g.fillText('SPANWALL LIVE SPIKE  monitor ' + M + '  ' + fpsShown + ' fps', 40 * dpr, 40 * dpr);
  g.font = ch + 'px Consolas, monospace';
  frames++; work += performance.now() - t0;
}
let fpsShown = 0;
setInterval(() => {
  fpsShown = Math.round(frames / 2);
  const ms = frames ? (work / frames).toFixed(1) : 0;
  fetch('/report?m=' + M + '&fps=' + fpsShown + '&ms=' + ms + '&w=' + W + '&h=' + H + '&dpr=' + dpr + '&vis=' + document.visibilityState).catch(() => {});
  frames = 0; work = 0;
}, 2000);
requestAnimationFrame(frame);
</script></body></html>
